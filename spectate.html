<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Magister Ludi — Spectate</title>

    <!--
      The interface's four voices (see index.html): Instrument Serif announces,
      Fraunces names, Instrument Sans works, IBM Plex Mono counts. This page is
      almost entirely a table of scores, so the mono face does nearly all of the
      talking.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Fraunces:opsz,wght@9..144,400..700&family=Instrument+Sans:wght@400..700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    />
  </head>
  <body>
    <canvas id="gl"></canvas>

    <header id="masthead">
      <h1>Spectate</h1>
      <p class="sub">
        A game played by nobody, one decision at a time — and every candidate it weighed,
        with the arithmetic that ranked them.
      </p>
    </header>

    <aside id="panel">
      <!--
        The setup strip. Seed, size and seats and nothing else: the game is an
        ordinary `newGame` with every chair a bot, so the same three numbers
        reproduce the same spectacle exactly.
      -->
      <section id="setup">
        <div class="row">
          <label class="field">
            <span class="field-label">Seed</span>
            <input type="text" id="seed" value="20260831" inputmode="numeric" />
          </label>
          <button type="button" id="seed-random" class="quiet">Randomise</button>
        </div>
        <div class="row">
          <label class="field">
            <span class="field-label">Map</span>
            <select id="size"></select>
          </label>
          <label class="field">
            <span class="field-label">Seats</span>
            <select id="seats"></select>
          </label>
          <button type="button" id="start">Start</button>
        </div>
      </section>

      <!--
        Where End Turn sits in the game. **Next Action** applies exactly one
        `BotDecision`; **Play turn** runs to the end of the current turn. There is
        no third speed on purpose — the point of the page is reading one decision
        at a time, and a coarse skip is `Play turn` pressed twice.
      -->
      <section id="transport">
        <button type="button" id="next-action" disabled>Next action</button>
        <button type="button" id="play-turn" class="quiet" disabled>Play turn</button>
        <span id="clock">—</span>
      </section>

      <!-- One line per seat, so the numbers in the feed have somewhere to stand. -->
      <section id="seats-strip"></section>

      <section id="feed-head">
        <h2>Decisions</h2>
        <span id="feed-count">—</span>
      </section>
      <div id="feed"></div>
    </aside>

    <script type="module" src="/src/spectate/main.ts"></script>
  </body>
</html>
