<!-- Not a Tabler icon: a *composition* of two Tabler drawings, and it is `mountedRanged.svg`
     with one thing changed. The horse is Tabler `horse` (MIT) verbatim, at the same 0.75
     scale in the same corner with its stroke-width divided back out (2.75/0.75), because
     the family has to say the line — these two are the mounted line's ranged ranks and
     they ride the same animal. The rank is the **diagonal**: `bow`'s arrowhead corner and
     shaft, mirrored about the middle of the box (`M17 3h4v4` → `M7 3h-4v4`), so the
     chariot archer's shot goes away over the tail and the horse archer's goes out ahead
     of the animal. Nothing was re-fitted; both upstream paths are still copy-pasteable.
     A bow at full draw was the first design and it was drawn four times and thrown away
     each time: `crossbowman.svg`'s own note already records why (at this weight a stave
     and its chord close into a solid lens), and a bow small enough to sit beside a horse
     closes into a letter D. So the rank is carried by the axis, which is the rule the
     club and the sword are separated by — `warrior.svg` runs on the diagonal opposite
     `melee.svg` for exactly this reason. -->
