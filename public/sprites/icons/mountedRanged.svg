<!-- Not a Tabler icon: Tabler has no horse-archer, so this is a *composition* of two
     of its drawings and is marked as one. The horse is Tabler `horse` (MIT) verbatim,
     scaled 0.75 into the lower-left with its stroke-width divided back out (2.75/0.75)
     so it prints at the family's weight; the arrow is Tabler `bow`'s (MIT) arrowhead
     corner `M17 3h4v4` with its shaft cut short so it clears the horse's back. Nothing
     was re-fitted — the two upstream paths are copy-pasteable out of this file. -->
