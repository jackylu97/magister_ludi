<!-- Not a Tabler icon: Tabler has no lance and no armoured rider, so this is a
     *composition* of one of its drawings and one shape drawn here, and is marked as one.
     The horse is Tabler `horse` (MIT) verbatim, at the same 0.75 scale in the same corner
     the two ranged ranks put it in, with its stroke-width divided back out (2.75/0.75) so
     it prints at the family's weight — the family says the line. The rank is the
     **lance**: one haft laid clear across the box on a shallow diagonal, aimed the way
     the horse is facing. It is the longest single stroke in the badge set and that is the
     whole of the mark; a spike head was drawn on the point and cut, because a triangle
     three units wide on the end of a bar at this weight is a mallet, and the piece read
     as a horse under a hammer. Length and axis, which are what survive twenty-four
     pixels — a short arrow in the corner is the ranged rank, a bar across the whole box
     is this one. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="256" height="256"><g fill="none" stroke="#2f2b32" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round">
