<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Magister Ludi: the Abacus at its three stages</title>
    <!--
      A look-dev page for the Abacus styling pass (2026-11-18). It mounts the
      game's own bead page, Abacus screen and Opus close with a made-up table,
      so a style option can be judged where the player meets it. It is not a
      build input (`vite.config.ts` does not name it): the dev server serves it.

      ?stage=bead | screen | close     which page to show (default bead)
      ?look=A | B | C | D | today      the style option (src/render3d/abacusLooks.ts)
      ?abacusPlaces=8                  places on a rod
      ?abacusFreeze=0.5                stop the slide part way, for a picture
      ?hold=1                          Opus close: stop after the golden bead lands
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz@0,6..72;1,6..72&family=Fraunces:opsz,wght@9..144,400..700&family=Instrument+Sans:wght@400..700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    />
  </head>
  <body>
    <div id="bead-overlay" class="triumph-overlay" role="dialog" aria-modal="true" aria-label="A bead" hidden></div>

    <div
      id="opus-close-overlay"
      class="opus-close"
      role="dialog"
      aria-modal="true"
      aria-label="The Magnum Opus is finished"
      tabindex="-1"
      hidden
    ></div>

    <button id="abacus-trigger" type="button" hidden>Abacus</button>
    <div id="abacus-overlay" class="abacus-overlay" role="dialog" aria-modal="true" aria-label="The Abacus" hidden>
      <div class="abacus-sheet">
        <header class="abacus-head">
          <div class="abacus-head-titles">
            <h2 class="abacus-title">The Abacus</h2>
          </div>
          <button id="abacus-close" class="abacus-close" type="button" aria-label="Close">×</button>
        </header>
        <div id="abacus-stage" class="abacus-stage"></div>
        <div id="abacus-register" class="abacus-register"></div>
      </div>
    </div>

    <script type="module" src="/src/abacusSpike/stages.ts"></script>
  </body>
</html>
